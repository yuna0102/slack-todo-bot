<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#191C24"/>
      <stop offset="0.6" stop-color="#0B0C10"/>
      <stop offset="1" stop-color="#040405"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9AA8FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9AA8FF" stop-opacity="0"/>
    </radialGradient>
    <!-- 크롬 반사: 얇은 면에서도 금속감이 나도록 대비 강한 띠 -->
    <linearGradient id="chrome" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.28" stop-color="#AEB4C0"/>
      <stop offset="0.42" stop-color="#3E434E"/>
      <stop offset="0.5" stop-color="#F5F7FB"/>
      <stop offset="0.66" stop-color="#7D8494"/>
      <stop offset="0.85" stop-color="#262A33"/>
      <stop offset="1" stop-color="#C3C9D4"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#8F96A6" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#C8CEFF" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="360" fill="url(#glow)"/>

  <!-- 헤어라인 링 (위쪽을 살짝 끊어 여백) -->
  <path d="M600 197 A328 328 0 1 1 424 197" fill="none" stroke="url(#hair)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 뾰족한 크롬 체크: 양 끝은 바늘처럼, 꺾이는 곳만 두께 -->
  <path d="M342 500 L474 676 L716 330 L474 626 Z" fill="#B9C2FF" opacity="0.35" filter="url(#blur)"/>
  <path d="M342 500 L474 676 L716 330 L474 626 Z" fill="url(#chrome)"/>
  <path d="M342 500 L474 626 L716 330" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.5" stroke-linejoin="miter"/>

  <!-- 길쭉한 4각 별 하나 -->
  <path d="M742 238 L750 292 L790 300 L750 308 L742 362 L734 308 L694 300 L734 292 Z" fill="url(#chrome)"/>
  <path d="M742 238 L750 292 L790 300 L750 308 L742 362 L734 308 L694 300 L734 292 Z" fill="#FFFFFF" opacity="0.35"/>
</svg>
