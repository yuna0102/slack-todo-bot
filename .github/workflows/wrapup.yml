name: 할 일 랩업

on:
  schedule:
    # GitHub cron은 UTC 기준 → KST = UTC+9
    # 평일 09:00, 18:00 KST
    - cron: "0 0,9 * * 1-5"
  workflow_dispatch: # Actions 탭 수동 실행 + 아이폰 단축어가 할 일 등록 직후 호출

# 할 일을 연달아 등록해도 실행이 겹치지 않게 한 번에 하나씩, 대기는 최신 1개만 유지
concurrency:
  group: wrapup
  cancel-in-progress: false

jobs:
  wrapup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python wrapup.py
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_TARGET: ${{ secrets.SLACK_TARGET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 없으면 Linear 동기화는 건너뜀
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEY: ${{ secrets.LINEAR_TEAM_KEY }}
          LINEAR_TEAM_WS_API_KEY: ${{ secrets.LINEAR_TEAM_WS_API_KEY }}
          LINEAR_TEAM_WS_TEAM_KEY: ${{ secrets.LINEAR_TEAM_WS_TEAM_KEY }}
