display_information:
  name: 할일봇
  description: 음성으로 받은 할 일을 모으고 정해진 시간에 랩업해줍니다
features:
  bot_user:
    display_name: todo-bot
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
      - groups:history
      - im:history
      - im:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
